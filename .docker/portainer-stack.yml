# Stack Portainer per pimshelf-from-scratch (server).
# Il codice NON è dentro l'immagine: è un clone git su host (APP_DIR) montato nei container.
# La pipeline GitHub Actions (self-hosted runner o SSH) aggiorna APP_DIR con git pull e poi lavora con `docker exec`.
#
# Variabili richieste (impostale in Portainer > Stack > Environment variables):
#   STACK_NAME, APP_DIR, APP_UID, APP_GID, WEB_PORT,
#   DB_NAME, DB_USER, DB_PASSWORD, DB_ROOT_PASSWORD

services:
    db:
        image: mariadb:10.11
        container_name: ${STACK_NAME}-db
        restart: unless-stopped
        command: [ mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci, --innodb-file-per-table=1 ]
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - database:/var/lib/mysql
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 10s
            retries: 10
            start_period: 30s
            timeout: 5s

    php:
        image: pimcore/pimcore:php8.3-v3
        container_name: ${STACK_NAME}-php
        restart: unless-stopped
        user: "${APP_UID}:${APP_GID}"
        environment: &app-env
            APP_ENV: prod
            APP_DEBUG: "0"
            PIMCORE_DEV_MODE: "false"
            COMPOSER_HOME: /tmp/composer
            DATABASE_HOST: db
            DATABASE_PORT: "3306"
            DATABASE_USER: ${DB_USER}
            DATABASE_PASSWORD: ${DB_PASSWORD}
            DATABASE_NAME: ${DB_NAME}
            DATABASE_SERVER_VERSION: 10.11.0-MariaDB
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ${APP_DIR}:/var/www/html

    supervisord:
        image: pimcore/pimcore:php8.3-supervisord-v3
        container_name: ${STACK_NAME}-supervisord
        restart: unless-stopped
        user: "${APP_UID}:${APP_GID}"
        environment: *app-env
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ${APP_DIR}:/var/www/html
            - ${APP_DIR}/.docker/supervisord.conf:/etc/supervisor/conf.d/pimcore.conf:ro

    nginx:
        image: nginx:stable-alpine
        container_name: ${STACK_NAME}-nginx
        restart: unless-stopped
        ports:
            - "${WEB_PORT}:80"
        volumes:
            - ${APP_DIR}:/var/www/html:ro
            - ${APP_DIR}/.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

volumes:
    database:
        # nome esplicito: non dipende dal nome dato allo stack in Portainer
        name: ${STACK_NAME}-database
